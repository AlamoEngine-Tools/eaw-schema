name: release

# Publishes the schema. Servers do not read main: they resolve the newest GitHub release whose
# version is inside their supported range and read the files at that tag. The version bump is
# the act of publishing: a merge that raises schemaVersion in eaw/_index.json tags and releases;
# a merge that changes eaw/ or lua/ without raising it leaves the changes pending on main, and
# the next bump publishes everything accumulated since the last tag. So main may run ahead of
# the newest release between releases, and released servers never see a half-finished cycle.
#
# The manual dispatch is the ship-time run: there a pending change without a bump fails, so a
# forgotten bump is caught when it matters.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate-schema.yml

  release:
    name: publish release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: decide
        id: decide
        env:
          STRICT: ${{ github.event_name == 'workflow_dispatch' }}
        run: bash .github/scripts/release-tag.sh

      - name: publish
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
