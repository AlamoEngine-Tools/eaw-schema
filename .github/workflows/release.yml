name: release

# Step 2 of a schema release, after the bump PR from "Prepare Release" is merged. Run from the
# Actions tab on main. Servers do not read main: they resolve the newest GitHub release whose
# version is inside their supported range and read the files at that tag, so a tag is a promise
# that never moves. Nothing publishes on push; main may run ahead of the newest release between
# releases, and released servers never see a half-finished cycle.
#
#   guard      main only; v<schemaVersion> from eaw/_index.json does not exist yet
#   validate   the schema validation workflow
#   publish    the GitHub release at this commit, with generated notes

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    name: Version guard
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/.*"schemaVersion"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' eaw/_index.json | head -n 1)
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=eaw/_index.json::schemaVersion '$version' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released - run Prepare Release for a new version first"
            exit 1
          fi
          echo "tag=v$version" >>"$GITHUB_OUTPUT"
          echo "Releasing v$version" >>"$GITHUB_STEP_SUMMARY"

  validate:
    name: validate
    needs: guard
    uses: ./.github/workflows/validate-schema.yml
    permissions:
      contents: read

  publish:
    name: publish release
    needs: [guard, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
