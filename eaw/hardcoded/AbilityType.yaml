name: AbilityType
description:
  en: "Engine ability behaviour identifiers. Used as the Type tag value in SpecialAbilityData entries and as the first field of AbilitySfxMap tuples. Some values (HUNT, DEFEND, BARRAGE, etc.) also appear in BehaviorModule — they are a separate enum; do not conflate them. Values verified from FoC AbilitySfxMap game data; the full set may be larger once complete SpecialAbilityData game files are available."
values:
  - name: AVOID_DANGER
    description:
      en: "Scout / avoid danger behaviour."
  - name: BARRAGE
    description:
      en: "Barrage attack mode."
  - name: BLAST
    description:
      en: "Blast attack ability."
  - name: BUZZ_DROIDS
    description:
      en: "Buzz droids ability."
  - name: DEFEND
    description:
