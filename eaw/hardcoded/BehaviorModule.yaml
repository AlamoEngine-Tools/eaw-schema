name: BehaviorModule
description:
  en: "Behaviour-module flag tokens referenced by the Behavior, GalacticBehavior, LandBehavior, SpaceBehavior, and DeployedBehavior tags. Multiple tokens are comma-separated."
values:
  - name: ABILITY_COUNTDOWN
    description:
      en: "Activates an ability-cooldown countdown display for the unit."
    notes:
      en: "Used in Behavior, LandBehavior, and SpaceBehavior in the base game."
  - name: AFFECTED_BY_SHIELD
    notes:
      en: "Unique to LandBehavior in the base game."
  - name: AMBIENT_SFX
    notes:
      en: "Used in LandBehavior and SpaceBehavior in the base game."
  - name: ASTEROID_FIELD_DAMAGE
    notes:
      en: "Unique to SpaceBehavior in the base game."
  - name: BARRAGE
    notes:
      en: "Used in LandBehavior and SpaceBehavior in the base game."
  - name: BASE_SHIELD
    description:
      en: "Applies a base-wide shield that protects all structures within the base perimeter."
    notes:
      en: "Used in Behavior and LandBehavior in the base game."
  - name: BIKE_LOCOMOTOR
    groups: [Locomotor]
    notes:
      en: "Unique to LandBehavior in the base game."
  - name: BOMB
    description:
      en: "Marks this projectile entity as a bomb dropped during a bombing run."
    notes:
      en: "Used in Behavior and LandBehavior in the base game."
  - name: BUZZ_DROIDS
    notes:
      en: "Unique to SpaceBehavior in the base game."
  - name: CAPTURE_POINT
    description:
      en: "Designates the object as a capturable control point on the tactical map."
    notes:
      en: "Used in Behavior and LandBehavior in the base game."
  - name: CASH_POINT
    description:
      en: "Generates a periodic credit income for the owning faction."
    notes:
      en: "Unique to Behavior in the base game."
  - name: DAMAGE_TRACKING
    description:
      en: "Enables per-unit damage tracking, required for repair and health display."
    notes:
      en: "Used in Behavior, LandBehavior, and SpaceBehavior in the base game."
  - name: DEBRIS
    notes:
      en: "Used in LandBehavior and SpaceBehavior in the base game."
  - name: DEMOLITION
    notes:
      en: "Unique to LandBehavior in the base game."
  - name: DEPLOY_TROOPERS
    notes:
      en: "Unique to LandBehavior in the base game."
  - name: DISABLE_FORCE_ABILITIES
    notes:
