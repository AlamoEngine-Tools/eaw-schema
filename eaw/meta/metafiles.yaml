# Directories the engine walks, taking every file it finds. A file here is loaded because of where
# it sits, so no registry names it and none ever will - which is why these are not metafiles. The
# list is measured against the shipped game binary, which carries each as a literal directory path.
scannedDirectories:
  - path: data/xml/enum/
    description:
      en: "Walked at startup. Every file holds an EnumDefinition."
  - path: data/xml/ai/galacticmarkup/
    description:
      en: "Walked at startup. Every file holds a Galactic_Markup."
  - path: data/xml/ai/goalfunctions/
    description:
      en: "Walked at startup. Every file holds a FunctionSet."
  - path: data/xml/ai/goals/
    description:
      en: "Walked at startup. Every file holds a Goals."
  - path: data/xml/ai/hintsets/
    description:
      en: "Walked at startup. Every file holds a HintSets."
  - path: data/xml/ai/perceptualequations/
    description:
      en: "Walked at startup. Every file holds an Equations."
  - path: data/xml/ai/players/
    description:
      en: "Walked at startup. Every file holds an AIPlayerType."
  - path: data/xml/ai/templates/
    description:
      en: "Walked at startup. Every file holds an AITemplates."