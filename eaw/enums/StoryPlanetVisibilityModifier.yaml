name: StoryPlanetVisibilityModifier
description:
  en: "Visibility modifier applied to a planet via the SET_PLANET_VISIBILITY_LEVEL reward type (Reward_Param3). Using 'None' removes the modifier that was set with the given tag."
values:
  - name: Credit_Income_Breakdown
    description:
      en: "Reveals a breakdown of credit income for the planet."
  - name: Fleet_Contents
    description:
      en: "Reveals the full contents of fleets in orbit."
  - name: Ground_Company_Contents
    description:
      en: "Reveals the full contents of ground companies on the planet."
  - name: Maximum
    description:
      en: "Applies maximum visibility to the planet (reveals everything)."
  - name: None
    description:
      en: "Removes a previously applied visibility modifier. Specify the same tag used when the modifier was added."
  - name: Num_Fleets
    description:
      en: "Shows the number of fleets in orbit but displays units as question marks."
  - name: Num_Ground_Companies
    description:
      en: "Shows the number of ground companies but displays them as question marks."
  - name: Special_Structures
    description:
      en: "Reveals special structures on the planet."
  - name: Planet_Owner
    description:
      en: "Reveals the planet owner."
    notes:
      en: "Untested — may be a relic from an earlier version of the game."
  - name: Underworld_Default
    description:
      en: "Applies the default underworld (Zann Consortium) visibility profile."
    notes:
      en: "Untested — may be a relic from an earlier version of the game."
  - name: Good_Default
    description:
      en: "Applies the default Rebel Alliance visibility profile."
    notes:
      en: "Untested — may be a relic from an earlier version of the game."
  - name: Evil_Default
    description:
      en: "Applies the default Empire visibility profile."
    notes:
      en: "Untested — may be a relic from an earlier version of the game."
  - name: Super_Weapons
    description:
      en: "Reveals super weapons on the planet."
