  - name: ANY_THREAT
  - name: NO_THREAT
  - name: FRIENDLY_ONLY
  - name: FRIENDLY_IGNORE_THREAT
  - name: ENEMY_UNDEFENDED
  - name: LOW_THREAT
  - name: MEDIUM_THREAT
  - name: HIGH_THREAT
  - name: ENEMY_DESTINATION
  - name: SINGLE_HOP_DISCONNECTED
