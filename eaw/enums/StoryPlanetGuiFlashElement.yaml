name: StoryPlanetGuiFlashElement
description:
  en: "GUI element on the main planet screen that can be flashed by the FLASH_PLANET_GUI reward type (Reward_Param2)."
values:
  - name: FLASH_AFFILIATION
    description:
      en: "Flashes the planet affiliation/ownership indicator."
  - name: FLASH_FLEET
    description:
      en: "Flashes a fleet slot on the planet panel. Use Reward_Param3 to specify the fleet index (0–2)."
  - name: FLASH_TROOPS
    description:
      en: "Flashes the ground troops section of the planet panel."
  - name: FLASH_PLANET_NAME
    description:
      en: "Flashes the planet name label."
  - name: FLASH_CREDITS
    description:
      en: "Flashes the planet's credit income display."
  - name: FLASH_PLANET_VALUE
    description:
      en: "Flashes the strategic value indicator for the planet."
  - name: FLASH_WEATHER
    description:
      en: "Flashes the weather indicator on the planet panel."
  - name: FLASH_PLANET
    description:
      en: "Flashes the main planet icon."
  - name: FLASH_ABILITY_SLOT
    description:
      en: "Flashes a galactic special ability slot on the planet panel."
  - name: FLASH_SMUGGLED
    description:
      en: "Flashes the smuggled goods indicator (FoC)."
  - name: FLASH_SMUGGLER
    description:
      en: "Flashes the smuggler unit slot (FoC)."
  - name: FLASH_COINS
    description:
      en: "Flashes the coins/income indicator on the planet panel."
  - name: FLASH_PRODUCTION
    description:
      en: "Flashes the production section of the planet panel."
  - name: FLASH_BASE_BARS
    description:
      en: "Flashes the ground and space base level bars on the planet panel."
