name: SpecialAbilityActivationStyle
kind: schemaFixed
description:
  en: "Controls when and how a special ability is triggered."
values:
  - name: USER_INPUT
  - name: GROUND_ACTIVATED
  - name: GROUND_AUTOMATIC
  - name: SPACE_AUTOMATIC
  - name: GALACTIC_AUTOMATIC
  - name: COMBAT_AUTOMATIC
  - name: SKIRMISH_AUTOMATIC
  - name: SPECIAL_ATTACK
  - name: TAKE_DAMAGE
  # Named by the engine as the one supported style for two ability classes, in
  # HeroAssassinAbilityClass::Validate_Data (01554930) and
  # EliminateHeroAbilityClass::Validate_Data (01552c80). Neither appears anywhere in the shipped
  # corpus, because neither ability class does - but writing the value the engine asks for must not
  # be reported as an unknown enum member.
  - name: COMBAT_IMMINENT
  - name: HERO_DETECTED
  # The twelfth case in SpecialAbilityClass::Validate_Data's switch (00c1f7a0), sitting in the
  # arm that refuses Causes_Despawn alongside the other five automatic styles, with its member
  # string Global_Automatic in the image. No shipped file uses it, and it was missing here - so a
  # mod writing the value the engine handles was told it did not exist.
  - name: GLOBAL_AUTOMATIC
