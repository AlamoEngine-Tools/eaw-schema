name: StoryBattleMode
description:
  en: "Battle context filter used by several story event and reward parameters."
values:
  - name: SPACE
    description:
      en: "Applies only to space battles."
  - name: GROUND
    description:
      en: "Applies only to ground battles."
  - name: EITHER
    description:
      en: "Applies to both space and ground battles."
  - name: LAND
    description:
      en: "Alias for Ground used in some older script files."
