name: ProjectileCategory
kind: schemaFixed
description:
  en: "C++ enum (DB Type 74) classifying a projectile's category. Used by the engine for audio, visual, and gameplay differentiation between projectile types."
values:
  - name: NONE
    description:
      en: "No category. The engine's default before a category is assigned."
  - name: BOMB
    description:
      en: "Bomb projectile."
  - name: CLUSTER_BOMB
    description:
      en: "Cluster bomb projectile."
  - name: DEFAULT
    description:
      en: "Default / unclassified projectile category."
  - name: GRENADE
    description:
      en: "Grenade projectile."
  - name: LASER
    description:
      en: "Laser bolt projectile. The shipped data overwhelmingly writes it as 'Laser' (79 uses, against 4 'LASER' and 1 'laser'); all three load, because the engine matches case-insensitively."
  - name: LIGHT_SABER
    description:
      en: "Lightsaber projectile."
  - name: MISSILE
    description:
      en: "Missile projectile."
  - name: MPTL_ROCKET
    description:
      en: "MPTL (Mobile Proton Torpedo Launcher) rocket projectile."
  - name: ROCKET
    description:
      en: "Rocket projectile."
  - name: STATIC_BOMB
    description:
      en: "Static bomb projectile."
