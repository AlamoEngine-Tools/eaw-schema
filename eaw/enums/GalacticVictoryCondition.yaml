name: GalacticVictoryCondition
kind: schemaFixed
description:
  en: "Galactic-Conquest victory condition. Listed on a Campaign's Human_/AI_Victory_Conditions tags (and the Good_/Evil_ pair, which the 2018 engine build does not read), separated by commas only - a space inside the list makes one unrecognised name. The campaign is won when any listed condition is met. Engine XML value type 69."
values:
  - name: GALACTIC_ALL_PLANETS_CONTROLLED
  - name: GALACTIC_CONQUER_ENEMY_HOMEWORLD_AND_LEADER
  - name: GALACTIC_CONTROL_NAMED_PLANETS
    description:
      en: "Tested against the side's _Victory_Planet_Names."
  - name: GALACTIC_CREDITS_ACCRUED
    description:
      en: "Credits at or above the side's _Victory_Credit_Target."
  - name: GALACTIC_CYCLES_ELAPSED
    description:
      en: "Tested against the side's _Victory_Cycle_Limit, counted in galactic weeks."
  - name: GALACTIC_KILL_ENEMY_LEADER
    description:
      en: "Tested against the side's _Victory_Leader_Names."
  - name: GALACTIC_OPPONENT_CONTROLS_NO_PLANETS
    description:
      en: "Tested against the side's _Victory_Faction_Names."
  - name: GALACTIC_PERCENTAGE_CONTROL
    description:
      en: "Share of planets controlled at or above the side's _Victory_Galactic_Control, a fraction from 0 to 1."
  - name: GALACTIC_SUPER_WEAPON_DESTROYS_LAST_ENEMY_PLANET
  - name: GALACTIC_SUPER_WEAPON_DESTRUCTION
  - name: GALACTIC_SUPER_WEAPON_KILLS_ENEMY_LEADER
