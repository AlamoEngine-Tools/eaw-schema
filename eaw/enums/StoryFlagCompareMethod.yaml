name: StoryFlagCompareMethod
description:
  en: "Comparison operator used by the STORY_FLAG and STORY_ACCUMULATE event types (Event_Param3 and Event_Param2)."
values:
  - name: GREATER_THAN
    description:
      en: "Fires when the flag value is strictly greater than the target value."
  - name: LESS_THAN
    description:
      en: "Fires when the flag value is strictly less than the target value."
  - name: EQUAL_TO
    description:
      en: "Fires when the flag value equals the target value."
  - name: GREATER_THAN_EQUAL_TO
    description:
      en: "Fires when the flag value is greater than or equal to the target value."
  - name: LESS_THAN_EQUAL_TO
    description:
      en: "Fires when the flag value is less than or equal to the target value."
  - name: NOT_EQUAL_TO
    description:
      en: "Accepted by the parser, but its branch in the comparison does nothing, so an event using it never fires."
    notes:
      - kind: BuggedInEngine
        text:
          en: "The comparison has a branch for this value that does nothing at all, so the event never fires. Use a different operator, or invert the condition."
