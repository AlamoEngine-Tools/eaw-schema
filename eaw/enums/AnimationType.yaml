name: AnimationType
kind: schemaFixed
description:
  en: "Animation as the engine names it when it reads one from a value - the one list every animation tag is read through. Matched after trimming the ends and ignoring case, so the spaces inside a name are part of it: Turn Left, not TURNL. Spellings are the engine's own - Force_Revel_Begin is how it writes it."
