name: LightEffectType
kind: schemaFixed
description:
  en: "Type of dynamic light effect applied to a unit when a special ability is active. Full set taken from the engine's LightEffectType, whose members map to these names by dropping the LIGHT_EFFECT_ prefix."
values:
  - name: NONE
  - name: COLOR_FLASH
  - name: LINEAR_PULSE
  - name: SMOOTH_PULSE
  - name: TWO_WAY_PULSE
  - name: CONTINUOUS_SMOOTH_PULSE
  - name: OBJECT_FADE
