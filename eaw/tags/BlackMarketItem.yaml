tags:
  # No 'Name' entry: BlackMarketItem is a first-class object type whose identifier is the Name
  # *attribute* on <Item Name="...">, declared once via types.yaml (nameTag: Name). It is a symbol
  # definition, not a reference, and never appears as a child element - the same convention every
  # other object type follows (SFXEvent, BinkMovie, ...).
  - tag: Icon_Name
    type: NameReference
    referenceKind: textureFile
  - tag: Uncommon_Price_Multiplier
    type: Float
  - tag: Faction
    type: FactionReference
    referenceKind: xmlObject
    referenceType: Faction
  - tag: Tech_Level
    type: Int
    description:
      en: "Minimum technology level required to build."
  - tag: Ability_Names
    type: TypeReferenceList
    referenceKind: xmlObject
    semanticType: ownerAgnosticReference
  - tag: Base_Cost_Credits
    type: Int
  - tag: Localized_Name
    type: NameReference
    referenceKind: localisationKey
  - tag: Localized_Description
    type: NameReference
    referenceKind: localisationKey
  - tag: Used_By_Units
    type: TypeReferenceList
    referenceKind: xmlObject
    referenceType: GameObjectType
  - tag: Tutorial_Tech_Level
    type: Int
  - tag: Tutorial_Base_Cost_Credits
    type: Int
