tags:
  - tag: Type
    type: NameReference
    referenceKind: enum
    enumName: HardPointType
    description:
      en: "Weapon category of this hardpoint (laser, ion cannon, torpedo, etc.)."
  - tag: Is_Targetable
    type: Boolean
    description:
      en: "If true, enemies can target and destroy this hardpoint."
  - tag: Is_Destroyable
    type: Boolean
    description:
      en: "If true, this hardpoint can be destroyed in combat."
  - tag: Health
    type: Float
    description:
      en: "Hit points of this hardpoint."
  - tag: Model_To_Attach
    type: NameReference
    referenceKind: modelFile
    description:
      en: "Model attached to this hardpoint's bone on the parent unit."
  - tag: Attachment_Bone
    type: NameReference
    referenceKind: boneName
    description:
      en: "Bone in the parent model that this hardpoint attaches to. Hardpoint reticle will be displayed at this bones position."
  - tag: Collision_Mesh
    type: NameReference
    referenceKind: boneName
    description:
      en: "Collision bone on the unit skeleton used for hit detection on this hardpoint. Bone used must be within 3D models collision mesh."
  - tag: Damage_Decal
    type: NameReference
    referenceKind: boneName
    description:
      en: "Bone on the unit skeleton that when hardpoint is destroyed shows mesh that has bone referenced in the `child of` constraint."
  - tag: Damage_Particles
    type: NameReference
    referenceKind: boneName
    description:
      en: "Bone on the .alo model whose child damage proxies become visible when this hardpoint is destroyed. A particle effect is usually attached to that bone, but that is not required."
  - tag: Engine_Particles
    type: NameReference
    referenceKind: boneName
    description:
      en: "Bone in the parent model that engine exhaust/idle emission attaches to (e.g. HP_E_MAINENGINES) - a bone name, not a particle object reference."
  - tag: Tooltip_Text
    type: NameReference
    referenceKind: localisationKey
    description:
      en: "Localisation key for the tooltip text."
  - tag: Fire_Bone_A
    type: NameReference
    referenceKind: boneName
    description:
      en: "Primary fire origin bone on the model."
  - tag: Fire_Bone_B
    type: NameReference
    referenceKind: boneName
    description:
      en: "Secondary fire origin bone (for alternating or dual fire, can be same as Fire_Bone_A)."
  - tag: Randomize_Between_Fire_Bones
    type: Boolean
    description:
      en: "If true, draws a straight line between fire bones and randomly selects a point along line for origin of shot."
  - tag: Fire_Cone_Width
    type: Float
    description:
      en: "Horizontal fire cone arc in degrees."
  - tag: Fire_Cone_Height
    type: Float
    description:
      en: "Vertical fire cone arc in degrees."
  - tag: Fire_Projectile_Type
    type: TypeReference
    referenceKind: xmlObject
    referenceType: Projectile
    description:
      en: "Projectile type this hardpoint fires."
  - tag: Fire_Min_Recharge_Seconds
    type: Float
    description:
      en: "Minimum time between shots in seconds."
  - tag: Fire_Max_Recharge_Seconds
    type: Float
    description:
      en: "Maximum time between shots in seconds."
  - tag: Fire_Pulse_Count
    type: UInt
    description:
      en: "Number of shots fired in a single burst."
  - tag: Fire_Pulse_Delay_Seconds
    type: Float
    description:
      en: "Delay between individual shots within a burst."
  - tag: Fire_Range_Distance
    type: Float
    description:
      en: "Maximum engagement range."
  - tag: Fire_SFXEvent
    type: NameReference
    referenceKind: xmlObject
    referenceType: SFXEvent
    description:
      en: "Sound event played each time this hardpoint fires."
  - tag: Fire_Inaccuracy_Distance
    type: InaccuracyMap
    multipleAllowed: true
    description:
      en: "Per-target-category inaccuracy spread distance map."
  - tag: Fire_Category_Restrictions
    type: TypeReferenceList
    referenceKind: enum
    enumName: GameObjectCategoryType
    description:
      en: "Target categories this hardpoint is forbidden from engaging."
  - tag: Fire_When_Deployed
    type: Boolean
    description:
      en: "If true, this hardpoint fires only when the unit is deployed."
  - tag: Fire_When_Undeployed
    type: Boolean
    description:
      en: "If true, this hardpoint fires only when the unit is not deployed."
  - tag: Fire_When_In_Rocket_Attack_Mode
    type: Boolean
    description:
      en: "If true, this hardpoint fires only in rocket attack mode."
  - tag: Fire_When_In_Normal_Attack_Mode
    type: Boolean
    description:
      en: "If true, this hardpoint fires only in normal attack mode."
  - tag: Death_Explosion_Particles
    type: NameReference
    referenceKind: xmlObject
    referenceType: SpecialEffect
    description:
      en: "Particle effect played when this hardpoint is destroyed."
  - tag: Death_Explosion_SFXEvent
    type: NameReference
    referenceKind: xmlObject
    referenceType: SFXEvent
    description:
      en: "Sound event played when this hardpoint is destroyed."
  - tag: Death_Breakoff_Prop
    type: TypeReference
    referenceKind: xmlObject
    referenceType: SpaceProp
    description:
      en: "Space prop object spawned when this hardpoint breaks away on destruction."
  - tag: Defend_Mode_Weapon_Delay_Multiplier
    type: Float
    description:
      en: "Fire rate multiplier applied when the unit is in defend mode."
  - tag: Turbo_Mode_Weapon_Delay_Multiplier
    type: Float
    description:
      en: "Fire rate multiplier applied when the unit is in turbo/boost mode."
  - tag: Fire_Min_Range_Distance
    type: Float
    description:
      en: "Minimum engagement range; the hardpoint will not fire at closer targets."
  - tag: Allow_Opportunity_Fire_When_Idle
    type: Boolean
    description:
      en: "If true, this hardpoint fires at targets of opportunity when idle."
  - tag: Allow_Opportunity_Fire_When_Targeting
    type: Boolean
    description:
      en: "If true, this hardpoint also engages targets of opportunity while tracking a primary target."
  - tag: Fighter_Bay_Flyout_Distance
    type: Float
    description:
      en: "Distance fighters travel when launching from this bay hardpoint."
  - tag: Special_Ability_Name
    type: NameReference
    referenceKind: unknown
    description:
      en: "Ability enabled on the object this hardpoint is ATTACHED to while the hardpoint is alive. Validating it needs an owner-object ability lookup (which unit mounts this hardpoint?) that is not supported yet - typed as unknown so no false 'missing object' diagnostics are emitted."
  - tag: Repair_Cost_Per_Frame
    type: Float
    description:
      en: "Cost in credits per frame for repairing this hardpoint, object must have DUMMY_STAR_BASE behaviour for repair function to appear. (e.g. 1 every frame for 30 every second)"
  - tag: Repair_Amount_Per_Frame
    type: Float
    description:
      en: "Amount of health regained per frame for repairing this hardpoint, object must have DUMMY_STAR_BASE behaviour for repair function to appear. (e.g. 1 every frame for 30 every second)"
  - tag: Projectile_Damage
    type: Float
  - tag: Damage_Type
    type: DynamicEnumValue
    referenceKind: enum
    enumName: DamageType
    description:
      en: "Damage type this object's attacks inflict."
  - tag: Projectile_Appearance_Delay_Frames
    type: Int
    description:
      en: "Number of frames this projectile is delayed by before it appears. (e.g. Krayt Megaweapon Damage has a 30 frame delay over the ion, so the ion can take shields down first)"
  - tag: Power_To_Weapons_Mode_Weapon_Delay_Multiplier
    type: Float
  - tag: Full_Salvo_Weapon_Delay_Multiplier
    type: Float
  - tag: Fire_When_In_Defend_Mode
    type: Boolean
  - tag: Fire_When_In_Turbo_Mode
    type: Boolean
  - tag: Fire_When_In_Power_To_Weapons_Mode
    type: Boolean
  - tag: Engine_Death_Hide_Engine_Particles
    type: Boolean
  - tag: Is_Turret
    type: Boolean
  - tag: Turret_Rest_Angle
    type: FloatVector3
  - tag: Turret_Rotation_Offset
    type: FloatVector3
  - tag: Turret_Rotate_Speed
    type: Float
  - tag: Turret_Rotate_Extent_Degrees
    type: Float
  - tag: Turret_Elevate_Extent_Degrees
    type: Float
  - tag: Turret_Bone_Name
    type: NameReference
    referenceKind: boneName
  - tag: Barrel_Bone_Name
    type: NameReference
    referenceKind: boneName
  - tag: Requires_Manual_Target_Assignment
    type: Boolean
  - tag: Manual_Hardpoint_Firing_Cooldown_Secs
    type: Float
  - tag: Allows_Special_Weapon_Use
    type: Boolean
  - tag: Blast_Ability_Fire_Projectile_Type
    type: TypeReference
    referenceKind: xmlObject
    referenceType: Projectile
