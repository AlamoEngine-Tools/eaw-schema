tags:
  - tag: Activation_Min_Range
    type: Float
    validationOverride:
      validationId: non-negative-value
  - tag: Activation_Max_Range
    type: Float
    validationOverride:
      validationId: non-negative-value
  - tag: Damage_Amount
    type: Float
    validationOverride:
      # Zero is rejected here, unlike the six owners whose message is "cannot be less than zero":
      # ForceLightningAbilityClass::Validate_Data (01005ec0) says "must be greater than zero".
      validationId: positive-value
  - tag: Damage_Application_Time_In_Secs
    type: Float
    validationOverride:
      validationId: non-negative-value
  - tag: Start_Lightning_Frame_Number
    type: Float
    validationOverride:
      validationId: non-negative-value
  - tag: Lightning_Effect_Name
    type: NameReference
    referenceKind: xmlObject
  - tag: Lightning_Source_Bone_Name
    type: NameReference
    referenceKind: boneName
  - tag: Lightning_Target_Bone_Name
    type: NameReference
    referenceKind: boneName
  - tag: Lightning_Max_Targets
    type: Int
  - tag: Lightning_Targets_Radius
    type: Float
