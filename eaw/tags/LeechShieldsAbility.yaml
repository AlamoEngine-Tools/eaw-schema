tags:
  - tag: Activation_Min_Range
    type: Float
    validationOverride:
      validationId: non-negative-value
  - tag: Activation_Max_Range
    type: Float
    validationOverride:
      validationId: non-negative-value
  - tag: Duration_In_Secs
    type: Float
    validationOverride:
      # LeechShieldsAbilityClass::Validate_Data (01028000) tests Duration < 1.0 and then assigns
      # 1.0, so one second is legal and a shorter leech silently runs for a full second. Only this
      # owner: Sensor_Jamming_Ability and System_Spy_Ability carry the same tag name unchecked.
      validationId: at-least-one-second
  - tag: Shield_Damage_Per_Second
    type: Float
  - tag: Damage_Multiplier
    type: Float
  - tag: Beam_Color
    type: RGBA
  - tag: Beam_Bone_Name
    type: NameReference
    referenceKind: boneName
  - tag: Beam_Frames
    type: Int
  - tag: Beam_Width
    type: Float
  - tag: Beam_Texture_Name
    type: NameReference
    referenceKind: textureFile
  - tag: Beam_Effect_Name
    type: NameReference
    referenceKind: xmlObject
  - tag: Leech_Effect
    type: TypeReference
    referenceKind: xmlObject
    referenceType: GameObjectType
