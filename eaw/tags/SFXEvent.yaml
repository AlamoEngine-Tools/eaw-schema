tags:
  - tag: Is_Preset
    type: Boolean
    description:
      en: "If true, this is a reusable preset that other events can inherit from."
  - tag: Use_Preset
    type: NameReference
    referenceKind: xmlObject
    referenceType: SFXEvent
    description:
      en: "Name of a preset SFXEvent whose settings are inherited by this event."
  - tag: Samples
    type: NameReferenceList
    referenceKind: audioFile
    description:
      en: "List of audio sample filenames to randomly choose from."
  - tag: Pre_Samples
    type: NameReferenceList
    referenceKind: audioFile
    description:
      en: "Samples played before the main sample."
  - tag: Post_Samples
    type: NameReferenceList
    referenceKind: audioFile
    description:
      en: "Samples played after the main sample."
  - tag: Text_ID
    type: NameReferenceList
    referenceKind: localisationKey
    description:
      en: "Localisation string key for the display name."
  - tag: Play_Sequentially
    type: Boolean
    description:
      en: "If true, samples play in defined order rather than randomly."
  - tag: Priority
    type: AudioParamInt
    description:
      en: "Playback priority; higher-priority sounds preempt lower ones when channels are full."
  - tag: Probability
    type: SfxPercentage
    description:
      en: "Probability (0-1) that this event actually plays when triggered."
    notes:
      en: "(Type annotation is a best-guess inferred from observed game data — may need refinement.)"
  - tag: Play_Count
    type: SfxCount
    description:
      en: "Number of times the sample plays each time the event is triggered."
    notes:
      en: "(Type annotation is a best-guess inferred from observed game data — may need refinement.)"
  - tag: Loop_Fade_In_Seconds
    type: Float
    description:
      en: "Fade-in duration in seconds for looping sounds."
  - tag: Loop_Fade_Out_Seconds
    type: Float
    description:
      en: "Fade-out duration in seconds for looping sounds."
  - tag: Max_Instances
    type: SfxCount
    description:
      en: "Maximum simultaneous playback instances of this event."
    notes:
      en: "(Type annotation is a best-guess inferred from observed game data — may need refinement.)"
  - tag: Min_Volume
    type: SfxPercentage
    description:
      en: "Minimum volume level (0-1)."
    notes:
      en: "(Type annotation is a best-guess inferred from observed game data — may need refinement.)"
  - tag: Max_Volume
    type: SfxPercentage
    description:
      en: "Maximum volume level (0-1)."
    notes:
      en: "(Type annotation is a best-guess inferred from observed game data — may need refinement.)"
  - tag: Min_Pitch
    type: AudioParamInt
    description:
      en: "Minimum pitch shift applied to the sample."
  - tag: Max_Pitch
    type: AudioParamInt
    description:
      en: "Maximum pitch shift applied to the sample."
  - tag: Min_Pan2D
    type: AudioParamInt
    description:
      en: "Minimum 2D stereo pan value (-1 left to 1 right)."
  - tag: Max_Pan2D
    type: AudioParamInt
    description:
      en: "Maximum 2D stereo pan value (-1 left to 1 right)."
  - tag: Min_Predelay
    type: UInt
    description:
      en: "Minimum delay in milliseconds before playback starts."
  - tag: Max_Predelay
    type: UInt
    description:
      en: "Maximum delay in milliseconds before playback starts."
  - tag: Min_Postdelay
    type: UInt
    description:
      en: "Minimum delay in milliseconds after playback ends."
  - tag: Max_Postdelay
    type: UInt
    description:
      en: "Maximum delay in milliseconds after playback ends."
  - tag: Volume_Saturation_Distance
    type: Float
    description:
      en: "Distance at which the sound reaches its maximum volume."
  - tag: Kills_Previous_Object_SFX
    type: Boolean
    description:
      en: "If true, stops any previously playing sound on this object."
  - tag: Overlap_Test
    type: NameReference
    description:
      en: "Arbitrary grouping key; SFXEvents sharing the same value form a mutual-exclusion group and won't play simultaneously. Conventionally follows the pattern Unit_<UnitXmlObjectId> but any string is valid."
  - tag: Localize
    type: Boolean
    description:
      en: "If true, this sound is spatially localised to its 3D world position."
  - tag: Is_2D
    type: Boolean
    description:
      en: "If true, this sound plays flat (no 3D positioning)."
  - tag: Is_3D
    type: Boolean
    description:
      en: "If true, this sound is positioned at a 3D world location."
  - tag: Is_GUI
    type: Boolean
    description:
      en: "If true, this is a UI/HUD sound."
  - tag: Is_HUD_VO
    type: Boolean
    description:
      en: "If true, this is a heads-up-display voice-over."
  - tag: Is_Unit_Response_VO
    type: Boolean
    description:
      en: "If true, this is a unit-response voice-over (acknowledgement barks)."
  - tag: Is_Ambient_VO
    type: Boolean
    description:
      en: "If true, this is an ambient voice-over not tied to a unit action."
  - tag: Chained_SFXEvent
    type: SFXEventReference
    referenceKind: xmlObject
    referenceType: SFXEvent
    description:
      en: "A subsequent SFXEvent played automatically after this one finishes."
