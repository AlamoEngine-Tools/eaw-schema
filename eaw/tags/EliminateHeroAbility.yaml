# The class declares no tags of its own and inherits everything from SpecialAbility. This file
# exists only to narrow one INHERITED tag for this owner, which the engine does itself when it
# validates the ability at load.
#
# The element name is Eliminate_Hero_Ability. It appears nowhere in the shipped corpus, so
# everything here was read out of the engine rather than from data.
tags:
  - tag: Activation_Style
    type: DynamicEnumValue
    referenceKind: enum
    enumName: SpecialAbilityActivationStyle
    allowedValues:
      - HERO_DETECTED
    description:
      en: "When the ability triggers. The engine accepts only Hero_Detected and overwrites any other value at load, so the ability would silently do something else."
